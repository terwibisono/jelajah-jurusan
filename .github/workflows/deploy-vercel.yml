name: Deploy produksi ke Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-produksi
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy ke Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_mTNdFWmz0yKvfbmvX8bGj0X1
          VERCEL_PROJECT_ID: prj_IlBF8nftiD2kbSnqWGLZnp28lvUO
        run: |
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Cek situs hidup
        run: |
          sleep 5
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://jelajah-jurusan.vercel.app/api/status)
            echo "percobaan $i: HTTP $code"
            [ "$code" = "200" ] && curl -s https://jelajah-jurusan.vercel.app/api/status && exit 0
            sleep 10
          done
          echo "situs belum merespons 200"; exit 1
